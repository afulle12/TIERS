[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiers"
version = "27.0.0"
description = "Directed-dyad stochastic-game model of interstate conflict escalation, persistence, and de-escalation (UIW v27.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andrew Fuller" },
]
keywords = [
    "conflict",
    "international-relations",
    "stochastic-game",
    "MIDB",
    "UCDP",
    "conflict-modeling",
    "dyadic",
    "escalation",
    "interstate-dispute",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Social Sciences",
]
dependencies = [
    "pandas>=2.0,<4.0",
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.2,<2.0",
    "matplotlib>=3.7,<4.0",
    "networkx>=3.0,<4.0",
    "pyarrow>=12.0,<20.0",
    "duckdb>=0.10,<2.0",
    "dateparser>=1.2,<2.0",
    "openai>=1.0,<2.0",
    "huggingface_hub>=0.20,<1.0",
    "tqdm>=4.60,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<7.0",
    "ruff>=0.1.0,<1.0",
]

# [project.urls]
# Repository = "<repo-url>"  # TODO: add once public GitHub repo is created
# Documentation = "<repo-url>/tree/main/docs"

# [project.scripts]
# eirene-score = "scripts.cli.score:main"
# eirene-build = "scripts.cli.build:main"

[tool.setuptools]
packages = ["scripts", "scripts.build", "scripts.analysis", "scripts.model", "scripts.data"]
include-package-data = true

[tool.setuptools.package-data]
"scripts.data" = ["*.py"]
"scripts.build" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (used in some data loaders)
]

[tool.coverage.run]
source = ["scripts"]
omit = [
    "scripts/output/*",
    "scripts/cli/*",
]
